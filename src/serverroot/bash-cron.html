  Bash Cron Rsync.
</h2>

<p>Скрипты для генерации логов и копирования на удаленный сервер.

Состав проекта:
- Сервер (VM Centos 9).
    - Скрипт 1. Создаёт логи, делает ротацию.
    - Скрипт 2. Копирует логи на клиент (rsync).
    - Cron. Запускает скрипты с интервалами 2-3 минуты.
- Клиент (VM Centos 9).
</p>
